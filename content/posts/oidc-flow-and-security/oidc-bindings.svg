<text x="300" y="219.5" font-size="12" font-weight="400" fill="#3C3489" text-anchor="middle" dominant-baseline="central" data-box="r9">回调里的 state</text>
<path d="M300,156 L300,184" fill="none" stroke="#57606A" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah57606a)" data-seg="300,156,300,184"/>
<rect data-id="r10" x="400" y="106" width="160" height="48" rx="10" fill="#F6F8FA" stroke="#8C959F" stroke-width="1"/>
<text x="480" y="121" font-size="13" font-weight="600" fill="#1F2328" text-anchor="middle" dominant-baseline="central" data-box="r10">随请求发出</text>
<text x="480" y="139.5" font-size="12" font-weight="400" fill="#1F2328" text-anchor="middle" dominant-baseline="central" data-box="r10">nonce</text>
<rect data-id="r11" x="400" y="266" width="160" height="48" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="480" y="281" font-size="13" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central" data-box="r11">OP 写入 ID Token</text>
<text x="480" y="299.5" font-size="12" font-weight="400" fill="#085041" text-anchor="middle" dominant-baseline="central" data-box="r11">nonce 声明</text>
<path d="M480,156 L480,264" fill="none" stroke="#57606A" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah57606a)" data-seg="480,156,480,264"/>
<rect data-id="r12" x="400" y="346" width="160" height="48" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="480" y="361" font-size="13" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central" data-box="r12">RP 比对 ✓</text>
<text x="480" y="379.5" font-size="12" font-weight="400" fill="#3C3489" text-anchor="middle" dominant-baseline="central" data-box="r12">与会话中保存的一致</text>
<path d="M480,316 L480,344" fill="none" stroke="#57606A" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah57606a)" data-seg="480,316,480,344"/>
<rect data-id="r13" x="580" y="106" width="160" height="48" rx="10" fill="#F6F8FA" stroke="#8C959F" stroke-width="1"/>
<text x="660" y="121" font-size="13" font-weight="600" fill="#1F2328" text-anchor="middle" dominant-baseline="central" data-box="r13">随请求发出</text>
<text x="660" y="139.5" font-size="12" font-weight="400" fill="#1F2328" text-anchor="middle" dominant-baseline="central" data-box="r13">code_challenge</text>
<rect data-id="r14" x="580" y="266" width="160" height="48" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="660" y="281" font-size="13" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central" data-box="r14">OP 比对 ✓</text>
<text x="660" y="299.5" font-size="12" font-weight="400" fill="#085041" text-anchor="middle" dominant-baseline="central" data-box="r14">code_verifier 的哈希</text>
<path d="M660,156 L660,264" fill="none" stroke="#57606A" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah57606a)" data-seg="660,156,660,264"/>
