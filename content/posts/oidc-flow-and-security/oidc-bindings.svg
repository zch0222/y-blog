<svg xmlns="http://www.w3.org/2000/svg" width="770" height="456" viewBox="0 0 770 456" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif">
<title id="title">state、nonce、PKCE 的发出与校验位置</title>
<desc id="desc">三个随机值都随授权请求发出：state 在回调时由 RP 比对，code_verifier 在令牌交换时由 OP 比对，nonce 由 OP 写入 ID Token 后由 RP 比对。</desc>
<defs><marker id="ah57606a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#57606A"/></marker></defs>
<rect x="0.5" y="0.5" width="769" height="455" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/>
<rect data-id="r1" x="220" y="24" width="160" height="56" rx="8" fill="#FFFFFF" stroke="#8C959F" stroke-width="1"/>
<text x="300" y="43" font-size="15" font-weight="600" fill="#1F2328" text-anchor="middle" dominant-baseline="central" data-box="r1">state</text>
<text x="300" y="63" font-size="12" font-weight="400" fill="#424A53" text-anchor="middle" dominant-baseline="central" data-box="r1">防登录 CSRF</text>
<rect data-id="r2" x="400" y="24" width="160" height="56" rx="8" fill="#FFFFFF" stroke="#8C959F" stroke-width="1"/>
<text x="480" y="43" font-size="15" font-weight="600" fill="#1F2328" text-anchor="middle" dominant-baseline="central" data-box="r2">nonce</text>
<text x="480" y="63" font-size="12" font-weight="400" fill="#424A53" text-anchor="middle" dominant-baseline="central" data-box="r2">防 ID Token 重放 / 注入</text>
<rect data-id="r3" x="580" y="24" width="160" height="56" rx="8" fill="#FFFFFF" stroke="#8C959F" stroke-width="1"/>
<text x="660" y="43" font-size="15" font-weight="600" fill="#1F2328" text-anchor="middle" dominant-baseline="central" data-box="r3">PKCE</text>
<text x="660" y="63" font-size="12" font-weight="400" fill="#424A53" text-anchor="middle" dominant-baseline="central" data-box="r3">防授权码截获 / 注入</text>
<rect data-id="r4" x="20" y="105" width="170" height="50" rx="8" fill="#F6F8FA" stroke="#8C959F" stroke-width="1"/>
<text x="105" y="121" font-size="14" font-weight="600" fill="#1F2328" text-anchor="middle" dominant-baseline="central" data-box="r4">① 授权请求</text>
<text x="105" y="141" font-size="12" font-weight="400" fill="#424A53" text-anchor="middle" dominant-baseline="central" data-box="r4">/authorize · 前端通道</text>
<rect data-id="r5" x="20" y="185" width="170" height="50" rx="8" fill="#F6F8FA" stroke="#8C959F" stroke-width="1"/>
<text x="105" y="201" font-size="14" font-weight="600" fill="#1F2328" text-anchor="middle" dominant-baseline="central" data-box="r5">② 回调</text>
<text x="105" y="221" font-size="12" font-weight="400" fill="#424A53" text-anchor="middle" dominant-baseline="central" data-box="r5">/callback · 前端通道</text>
<rect data-id="r6" x="20" y="265" width="170" height="50" rx="8" fill="#F6F8FA" stroke="#8C959F" stroke-width="1"/>
<text x="105" y="281" font-size="14" font-weight="600" fill="#1F2328" text-anchor="middle" dominant-baseline="central" data-box="r6">③ 令牌交换</text>
<text x="105" y="301" font-size="12" font-weight="400" fill="#424A53" text-anchor="middle" dominant-baseline="central" data-box="r6">/token · 后端通道</text>
<rect data-id="r7" x="20" y="345" width="170" height="50" rx="8" fill="#F6F8FA" stroke="#8C959F" stroke-width="1"/>
<text x="105" y="361" font-size="14" font-weight="600" fill="#1F2328" text-anchor="middle" dominant-baseline="central" data-box="r7">④ 验证 ID Token</text>
<text x="105" y="381" font-size="12" font-weight="400" fill="#424A53" text-anchor="middle" dominant-baseline="central" data-box="r7">RP 本地</text>
<rect data-id="r8" x="220" y="106" width="160" height="48" rx="10" fill="#F6F8FA" stroke="#8C959F" stroke-width="1"/>
<text x="300" y="121" font-size="13" font-weight="600" fill="#1F2328" text-anchor="middle" dominant-baseline="central" data-box="r8">随请求发出</text>
